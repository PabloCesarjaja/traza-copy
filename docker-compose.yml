# docker-compose.yml
# Orquestación de todos los servicios del sistema TRAZA-Legal.
# Uso en producción: docker compose up --build
# Uso en desarrollo: docker compose -f docker-compose.yml -f docker-compose.override.yml up

services:

  # ─── Punto de entrada ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: traza-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - frontend
      - websocket-server
    networks:
      - traza-net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
      target: produccion
    container_name: traza-frontend
    restart: unless-stopped
    environment:
      - REACT_API_URL=${API_URL}
      - REACT_WS_URL=${WS_URL}
      - REACT_SUPABASE_URL=${SUPABASE_URL}
      - REACT_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    networks:
      - traza-net

  # ─── API Gateway ───────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
    container_name: traza-api-gateway
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:3001
      - CASE_SERVICE_URL=http://case-service:3002
      - TASK_SERVICE_URL=http://task-service:3003
      - DOCUMENT_SERVICE_URL=http://document-service:3004
      - WEBSOCKET_SERVER_URL=http://websocket-server:3005
      - AUDIT_SERVICE_URL=http://audit-service:3006
    depends_on:
      auth-service:
        condition: service_healthy
      case-service:
        condition: service_healthy
      task-service:
        condition: service_healthy
      document-service:
        condition: service_healthy
      websocket-server:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    networks:
      - traza-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Servicio de autenticación ─────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: ./apps/services/auth-service/Dockerfile
    container_name: traza-auth
    restart: unless-stopped
    environment:
      - PORT=3001
      - NODE_ENV=${NODE_ENV:-production}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY:-900}
      - REFRESH_TOKEN_EXPIRY=${REFRESH_TOKEN_EXPIRY:-604800}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
    networks:
      - traza-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Servicio de casos (RF-01) ─────────────────────────────────────────────
  case-service:
    build:
      context: .
      dockerfile: ./apps/services/case-service/Dockerfile
    container_name: traza-casos
    restart: unless-stopped
    environment:
      - PORT=3002
      - NODE_ENV=${NODE_ENV:-production}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - AUDIT_SERVICE_URL=http://audit-service:3006
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    networks:
      - traza-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Servicio de tareas (RF-02) ────────────────────────────────────────────
  task-service:
    build:
      context: .
      dockerfile: ./apps/services/task-service/Dockerfile
    container_name: traza-tareas
    restart: unless-stopped
    environment:
      - PORT=3003
      - NODE_ENV=${NODE_ENV:-production}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - AUDIT_SERVICE_URL=http://audit-service:3006
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    networks:
      - traza-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Servicio de documentos (RF-03) ────────────────────────────────────────
  document-service:
    build:
      context: .
      dockerfile: ./apps/services/document-service/Dockerfile
    container_name: traza-documentos
    restart: unless-stopped
    environment:
      - PORT=3004
      - NODE_ENV=${NODE_ENV:-production}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-traza-documentos}
      - AUDIT_SERVICE_URL=http://audit-service:3006
      - OCR_SERVICE_URL=http://ocr-service:8000
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      ocr-service:
        condition: service_healthy
    networks:
      - traza-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Servidor WebSocket (RF-04) ────────────────────────────────────────────
  websocket-server:
    build:
      context: .
      dockerfile: ./apps/websocket-server/Dockerfile
    container_name: traza-websocket
    restart: unless-stopped
    environment:
      - PORT=3005
      - NODE_ENV=${NODE_ENV:-production}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - traza-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Servicio de auditoría (RF-06) ─────────────────────────────────────────
  audit-service:
    build:
      context: .
      dockerfile: ./apps/services/audit-service/Dockerfile
    container_name: traza-auditoria
    restart: unless-stopped
    environment:
      - PORT=3006
      - NODE_ENV=${NODE_ENV:-production}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    networks:
      - traza-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Servicio OCR (Python + FastAPI) ──────────────────────────────────────
  ocr-service:
    build:
      context: ./apps/workers/ocr-service
      dockerfile: Dockerfile
    container_name: traza-ocr
    restart: unless-stopped
    environment:
      - PORT=8000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - MAX_TAMANO_MB=${OCR_MAX_TAMANO_MB:-25}
    networks:
      - traza-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3

  # ─── Redis (colas + caché) ─────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: traza-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-datos:/data
    networks:
      - traza-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  traza-net:
    driver: bridge
    name: traza-legal-network

volumes:
  redis-datos:
    name: traza-redis-datos