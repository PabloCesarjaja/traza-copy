# nginx.conf
# Reverse proxy de TRAZA-Legal.
# Enruta el tráfico entrante hacia los microservicios correspondientes.

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Límite de tamaño de carga (documentos hasta 25 MB)
    client_max_body_size 25M;

    sendfile on;
    keepalive_timeout 65;

    # Definición de upstreams (permite balanceo futuro)
    upstream frontend_upstream {
        server frontend:3000;
    }

    upstream api_gateway_upstream {
        server api-gateway:3000;
    }

    upstream websocket_upstream {
        server websocket-server:3005;
    }

    server {
        listen 80;
        server_name _;

        # ── Frontend (SPA React) ─────────────────────────────────────────────
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── API REST (todos los microservicios via gateway) ──────────────────
        location /api/ {
            proxy_pass http://api_gateway_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── WebSocket (Socket.IO) ────────────────────────────────────────────
        location /ws/ {
            proxy_pass http://websocket_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }
    }
}